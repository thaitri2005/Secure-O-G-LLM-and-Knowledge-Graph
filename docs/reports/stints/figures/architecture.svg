<text x="340.0" y="270.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Cut into passages</text>
<text x="340.0" y="288.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">each linked to page, well, date</text>
<path d="M340,228 L340,242" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
<rect x="225" y="322" width="230" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="340.0" y="348.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Check against the PDF</text>
<text x="340.0" y="366.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">nothing lost, nothing invented</text>
<path d="M340,306 L340,320" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
<rect x="520" y="30" width="330" height="380" rx="14" fill="#e6effe" stroke="#1d5fd6" stroke-width="2"/>
