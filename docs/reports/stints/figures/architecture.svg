<text x="1057.5" y="237.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">for people who are not developers:</text>
<text x="1057.5" y="255.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">answer, trust label, evidence,</text>
<text x="1057.5" y="273.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a guide, explanations on hover</text>
