<text x="341.0" y="578.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">passages, pages,</text>
<text x="341.0" y="596.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">search vectors</text>
