<circle cx="229" cy="50" r="12" fill="#fff"/>
<text x="229" y="55" font-size="14" font-weight="800" fill="#0e7c86" text-anchor="middle">1</text>
<text x="249" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Reading the reports</text>
<text x="461" y="56" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Khai</text>
<rect x="225" y="88" width="230" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="340.0" y="114.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Read each page</text>
<text x="340.0" y="132.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">text, tables and forms</text>
<rect x="225" y="166" width="230" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="340.0" y="192.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Rebuild known tables</text>
<text x="340.0" y="210.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">from the PDF&#x27;s own text</text>
<path d="M340,150 L340,164" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
