<text x="1057.5" y="339.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Question log</text>
<text x="1057.5" y="357.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">every question, how it was answered,</text>
<text x="1057.5" y="375.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">and every right or wrong mark</text>
