<text x="586.0" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">search</text>
<path d="M586,160 L586,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M586,262 L586,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="639" y="196" width="92" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="685.0" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Well facts</text>
<text x="685.0" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">checked values</text>
<path d="M685,160 L685,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M685,262 L685,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="738" y="196" width="92" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="784.0" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Daily activities</text>
<text x="784.0" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">totals by code</text>
<path d="M784,160 L784,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M784,262 L784,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="540" y="302" width="290" height="86" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="685.0" y="322.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">The answer</text>
<text x="685.0" y="340.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a total: calculated by code</text>
<text x="685.0" y="358.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">otherwise: written by AI (one call),</text>
<text x="685.0" y="376.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">then checked against the text by code</text>
