<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="The four parts of the system and who owns each">
<title>The four parts of the system and who owns each</title>
<defs><marker id="head-0e7c86" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker><marker id="head-14734a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14734a"/></marker><marker id="head-1d5fd6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fd6"/></marker><marker id="head-5d6d85" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d85"/></marker><marker id="head-6b46c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker></defs>
<rect width="1240" height="690" fill="#ffffff"/>
<rect x="20" y="170" width="150" height="96" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="95.0" y="204.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Drilling reports</text>
<text x="95.0" y="222.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">PDF files:</text>
<text x="95.0" y="240.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">end-of-well and daily</text>
