<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="The four parts of the system and who owns each">
<title>The four parts of the system and who owns each</title>
<defs><marker id="head-0e7c86" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker><marker id="head-14734a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14734a"/></marker><marker id="head-1d5fd6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fd6"/></marker><marker id="head-5d6d85" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d85"/></marker><marker id="head-6b46c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker></defs>
<rect width="1240" height="690" fill="#ffffff"/>
<rect x="20" y="170" width="140" height="96" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="90.0" y="204.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Drilling reports</text>
<text x="90.0" y="222.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">PDF files:</text>
<text x="90.0" y="240.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">end-of-well and daily</text>
<rect x="190" y="30" width="250" height="380" rx="14" fill="#dff3f4" stroke="#0e7c86" stroke-width="2"/>
<path d="M190,70 v-26 a14,14 0 0 1 14,-14 h222 a14,14 0 0 1 14,14 v26 z" fill="#0e7c86"/>
<circle cx="214" cy="50" r="12" fill="#fff"/>
<text x="214" y="55" font-size="14" font-weight="800" fill="#0e7c86" text-anchor="middle">1</text>
<text x="234" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Reading the reports</text>
<text x="426" y="56" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Khai</text>
<rect x="208" y="88" width="214" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="315.0" y="114.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Read each page</text>
<text x="315.0" y="132.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">text, tables and forms</text>
<rect x="208" y="166" width="214" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="315.0" y="192.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Rebuild known tables</text>
<text x="315.0" y="210.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">from the PDF&#x27;s own text</text>
<path d="M315,150 L315,164" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
<rect x="208" y="244" width="214" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="315.0" y="270.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Cut into passages</text>
<text x="315.0" y="288.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">each linked to page, well, date</text>
<path d="M315,228 L315,242" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
<rect x="208" y="322" width="214" height="62" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="315.0" y="348.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Check against the PDF</text>
<text x="315.0" y="366.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">nothing lost, nothing invented</text>
<path d="M315,306 L315,320" fill="none" stroke="#0e7c86" stroke-width="2.2" marker-end="url(#head-0e7c86)"/>
<rect x="480" y="30" width="430" height="380" rx="14" fill="#e6effe" stroke="#1d5fd6" stroke-width="2"/>
<path d="M480,70 v-26 a14,14 0 0 1 14,-14 h402 a14,14 0 0 1 14,14 v26 z" fill="#1d5fd6"/>
<circle cx="504" cy="50" r="12" fill="#fff"/>
<text x="504" y="55" font-size="14" font-weight="800" fill="#1d5fd6" text-anchor="middle">3</text>
<text x="524" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Answering engine</text>
<text x="896" y="56" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Tri</text>
<rect x="500" y="86" width="390" height="74" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="695.0" y="109.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Coordinator</text>
<text x="695.0" y="127.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">understands the question (one AI call)</text>
<text x="695.0" y="145.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">code chooses where to look</text>
<rect x="500" y="196" width="93" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="546.5" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Report text</text>
<text x="546.5" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">search</text>
<path d="M546,160 L546,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M546,262 L546,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="599" y="196" width="93" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="645.5" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Well facts</text>
<text x="645.5" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">checked values</text>
<path d="M645,160 L645,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M645,262 L645,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="698" y="196" width="93" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="744.5" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Activities</text>
<text x="744.5" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">totals by day</text>
<path d="M744,160 L744,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M744,262 L744,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="797" y="196" width="93" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="843.5" y="225.125" font-size="12.5" font-weight="700" fill="#0f1e33" text-anchor="middle">Causes</text>
<text x="843.5" y="241.625" font-size="10.5" font-weight="400" fill="#33445c" text-anchor="middle">around a problem</text>
<path d="M843,160 L843,194" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M843,262 L843,300" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<rect x="500" y="302" width="390" height="86" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="695.0" y="322.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">The answer</text>
<text x="695.0" y="340.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a total: calculated by code</text>
<text x="695.0" y="358.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">otherwise: written by AI (one call),</text>
<text x="695.0" y="376.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">then checked against the text by code</text>
<rect x="950" y="30" width="270" height="380" rx="14" fill="#eee9fb" stroke="#6b46c1" stroke-width="2"/>
<path d="M950,70 v-26 a14,14 0 0 1 14,-14 h242 a14,14 0 0 1 14,14 v26 z" fill="#6b46c1"/>
<circle cx="974" cy="50" r="12" fill="#fff"/>
<text x="974" y="55" font-size="14" font-weight="800" fill="#6b46c1" text-anchor="middle">4</text>
<text x="994" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Application</text>
<text x="1206" y="56" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Tri and Hung</text>
<rect x="968" y="86" width="234" height="74" rx="10" fill="#fff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="1085.0" y="109.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Backend service</text>
<text x="1085.0" y="127.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">ask a question, open a source,</text>
<text x="1085.0" y="145.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">mark an answer right or wrong</text>
<path d="M1085,160 L1085,194" fill="none" stroke="#6b46c1" stroke-width="2.2" marker-end="url(#head-6b46c1)"/>
<rect x="968" y="196" width="234" height="92" rx="10" fill="#fff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="1085.0" y="219.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Web application</text>
<text x="1085.0" y="237.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">for people who are not developers:</text>
<text x="1085.0" y="255.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">answer, trust label, evidence,</text>
<text x="1085.0" y="273.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a guide, explanations on hover</text>
<path d="M1085,288 L1085,316" fill="none" stroke="#6b46c1" stroke-width="2.2" marker-end="url(#head-6b46c1)"/>
<rect x="968" y="318" width="234" height="70" rx="10" fill="#fff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="1085.0" y="339.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Question log</text>
<text x="1085.0" y="357.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">every question and its answer,</text>
<text x="1085.0" y="375.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">and every right or wrong mark</text>
<rect x="190" y="480" width="1030" height="150" rx="14" fill="#dcf5e8" stroke="#14734a" stroke-width="2"/>
<path d="M190,520 v-26 a14,14 0 0 1 14,-14 h1002 a14,14 0 0 1 14,14 v26 z" fill="#14734a"/>
<circle cx="214" cy="500" r="12" fill="#fff"/>
<text x="214" y="505" font-size="14" font-weight="800" fill="#14734a" text-anchor="middle">2</text>
<text x="234" y="506" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Stores</text>
<text x="1206" y="506" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Hung</text>
<rect x="208" y="536" width="238" height="76" rx="10" fill="#fff" stroke="#14734a" stroke-width="1.5"/>
<text x="327.0" y="560.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">PostgreSQL</text>
<text x="327.0" y="578.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">passages, pages, search vectors,</text>
<text x="327.0" y="596.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the question log</text>
<rect x="460" y="536" width="238" height="76" rx="10" fill="#fff" stroke="#14734a" stroke-width="1.5"/>
<text x="579.0" y="560.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Neo4j</text>
<text x="579.0" y="578.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the knowledge graph:</text>
<text x="579.0" y="596.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">facts and activities</text>
<rect x="712" y="536" width="238" height="76" rx="10" fill="#fff" stroke="#14734a" stroke-width="1.5"/>
<text x="831.0" y="560.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">File store</text>
<text x="831.0" y="578.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a folder: report packages</text>
<text x="831.0" y="596.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">and page images</text>
<rect x="964" y="536" width="238" height="76" rx="10" fill="#fff" stroke="#14734a" stroke-width="1.5"/>
<text x="1083.0" y="560.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Loader</text>
<text x="1083.0" y="578.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">one command loads a package</text>
<text x="1083.0" y="596.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">and checks every step</text>
<path d="M160,218 L188,218" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<path d="M440,150 L478,150" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<text transform="translate(464,300) rotate(-90)" font-size="12" font-weight="600" fill="#5d6d85" text-anchor="middle">passages, as files too</text>
<path d="M910,123 L948,123" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<text transform="translate(934,300) rotate(-90)" font-size="12" font-weight="600" fill="#5d6d85" text-anchor="middle">answers with their evidence</text>
<path d="M315,410 L315,478" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<rect x="255.2" y="433" width="119.6" height="19" rx="9" fill="#fff" stroke="#14734a" stroke-width="1"/>
<text x="315" y="447" font-size="11.5" font-weight="600" fill="#14734a" text-anchor="middle">passage packages</text>
<path d="M695,478 L695,412" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<rect x="598.9" y="433" width="192.2" height="19" rx="9" fill="#fff" stroke="#14734a" stroke-width="1"/>
<text x="695" y="447" font-size="11.5" font-weight="600" fill="#14734a" text-anchor="middle">passages, activities, facts</text>
<path d="M1085,410 L1085,478" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<rect x="1025.2" y="433" width="119.6" height="19" rx="9" fill="#fff" stroke="#14734a" stroke-width="1"/>
<text x="1085" y="447" font-size="11.5" font-weight="600" fill="#14734a" text-anchor="middle">the question log</text>
<path d="M208,664 h44" stroke="#5d6d85" stroke-width="2.2"/>
<text x="260" y="668" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">works today</text>
<text x="368" y="668" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">All four parts run together on one laptop. A shared server is the next step.</text>
</svg>
