<text x="1057.5" y="127.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">ask a question, open a source,</text>
<text x="1057.5" y="145.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">mark an answer right or wrong</text>
