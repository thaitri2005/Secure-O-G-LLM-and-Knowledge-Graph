<text x="564" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Answering engine</text>
<text x="836" y="56" font-size="14" font-weight="600" fill="#fff" text-anchor="end">Tri</text>
<rect x="540" y="86" width="290" height="74" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="685.0" y="109.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Coordinator</text>
<text x="685.0" y="127.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">understands the question (one AI call)</text>
<text x="685.0" y="145.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">code chooses where to look</text>
<rect x="540" y="196" width="92" height="66" rx="10" fill="#fff" stroke="#1d5fd6" stroke-width="1.5"/>
