<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="How the application runs: containers behind one password">
<title>How the application runs: containers behind one password</title>
<defs><marker id="head-14734a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14734a"/></marker><marker id="head-1d5fd6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fd6"/></marker><marker id="head-5d6d85" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d85"/></marker><marker id="head-6b46c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker><marker id="head-a45a06" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45a06"/></marker></defs>
<rect width="1240" height="470" fill="#ffffff"/>
<rect x="20" y="150" width="150" height="90" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="95.0" y="181.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">A person</text>
<text x="95.0" y="199.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a browser,</text>
<text x="95.0" y="217.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">laptop or phone</text>
<rect x="200" y="30" width="800" height="400" rx="14" fill="#f5f8fc" stroke="#c9d4e3" stroke-width="2" stroke-dasharray="8 6"/>
<text x="216" y="56" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="start">One machine, started with one command (containers)</text>
<rect x="222" y="150" width="190" height="90" rx="10" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="317.0" y="181.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Proxy</text>
<text x="317.0" y="199.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">HTTPS, one shared password,</text>
<text x="317.0" y="217.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">serves the web application</text>
<rect x="452" y="130" width="220" height="130" rx="10" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="562.0" y="163.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Backend service</text>
<text x="562.0" y="181.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">one question at a time,</text>
<text x="562.0" y="199.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the others wait their turn;</text>
<text x="562.0" y="217.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">every question is logged,</text>
<text x="562.0" y="235.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">failures told in plain words</text>
<rect x="452" y="300" width="220" height="96" rx="10" fill="#e6effe" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="562.0" y="325.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Answering engine</text>
<text x="562.0" y="343.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the coordinator and its</text>
<text x="562.0" y="361.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">four places to look</text>
<text x="562.0" y="379.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">(runs inside the service)</text>
<rect x="712" y="80" width="268" height="76" rx="10" fill="#dcf5e8" stroke="#14734a" stroke-width="1.5"/>
<text x="846.0" y="104.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">PostgreSQL</text>
<text x="846.0" y="122.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">passages, search vectors, pages,</text>
<text x="846.0" y="140.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the question log</text>
<rect x="712" y="176" width="268" height="76" rx="10" fill="#dcf5e8" stroke="#14734a" stroke-width="1.5"/>
<text x="846.0" y="200.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Neo4j</text>
<text x="846.0" y="218.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">the knowledge graph:</text>
<text x="846.0" y="236.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">161 activities, 206 facts</text>
<rect x="712" y="272" width="268" height="62" rx="10" fill="#dcf5e8" stroke="#14734a" stroke-width="1.5"/>
<text x="846.0" y="298.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">Report package</text>
<text x="846.0" y="316.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">a folder: page images</text>
<rect x="712" y="346" width="268" height="54" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="846.0" y="369.05" font-size="13" font-weight="700" fill="#0f1e33" text-anchor="middle">Monitor and nightly backup</text>
<text x="846.0" y="386.05" font-size="11" font-weight="400" fill="#33445c" text-anchor="middle">alert to the group chat; copy kept elsewhere</text>
<rect x="1030" y="130" width="190" height="130" rx="10" fill="#fff1da" stroke="#a45a06" stroke-width="1.5"/>
<text x="1125.0" y="163.9" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">AI model</text>
<text x="1125.0" y="181.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">Qwen3-8B, the team&#x27;s</text>
<text x="1125.0" y="199.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">own copy (llama.cpp),</text>
<text x="1125.0" y="217.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">or a hosted open model</text>
<text x="1125.0" y="235.9" font-size="12" font-weight="400" fill="#33445c" text-anchor="middle">for public data only</text>
<path d="M170,195 L220,195" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<path d="M412,195 L450,195" fill="none" stroke="#6b46c1" stroke-width="2.2" marker-end="url(#head-6b46c1)"/>
<path d="M562,260 L562,298" fill="none" stroke="#1d5fd6" stroke-width="2.2" marker-end="url(#head-1d5fd6)"/>
<path d="M672,150 L710,122" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<path d="M672,200 L710,212" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<path d="M672,240 L710,296" fill="none" stroke="#14734a" stroke-width="2.2" marker-end="url(#head-14734a)"/>
<path d="M562,396 L562,418 L1125,418 L1125,262" fill="none" stroke="#a45a06" stroke-width="2.2" marker-end="url(#head-a45a06)"/>
<rect x="1025.6" y="327" width="198.79999999999998" height="19" rx="9" fill="#fff" stroke="#a45a06" stroke-width="1"/>
<text x="1125" y="341" font-size="11.5" font-weight="600" fill="#a45a06" text-anchor="middle">at most two calls a question</text>
<rect x="222" y="440" width="18" height="14" rx="4" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="248" y="452" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">application</text>
<rect x="337.9" y="440" width="18" height="14" rx="4" fill="#e6effe" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="363.9" y="452" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">engine</text>
<rect x="419.29999999999995" y="440" width="18" height="14" rx="4" fill="#dcf5e8" stroke="#14734a" stroke-width="1.5"/>
<text x="445.29999999999995" y="452" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">stores</text>
<rect x="500.69999999999993" y="440" width="18" height="14" rx="4" fill="#fff1da" stroke="#a45a06" stroke-width="1.5"/>
<text x="526.6999999999999" y="452" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">AI model</text>
