<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" width="1240" height="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="From an expert&#x27;s input to a test">
<title>From an expert&#x27;s input to a test</title>
<defs><marker id="head-5d6d85" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d85"/></marker><marker id="head-6b46c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker></defs>
<rect width="1240" height="300" fill="#ffffff"/>
<rect x="20" y="60" width="178" height="130" rx="10" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="109.0" y="103.475" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">1. Ask and mark</text>
<text x="109.0" y="120.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">the expert uses the</text>
<text x="109.0" y="138.475" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">application: Yes or No,</text>
<text x="109.0" y="155.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">and the right answer</text>
<rect x="224" y="60" width="178" height="130" rx="10" fill="#dcf5e8" stroke="#14734a" stroke-width="1.5"/>
<text x="313.0" y="112.225" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">2. Question log</text>
<text x="313.0" y="129.725" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">every question, the</text>
<text x="313.0" y="147.225" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">answer given, the mark</text>
<path d="M200,125 L222,125" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<rect x="428" y="60" width="178" height="130" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="517.0" y="103.475" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">3. Spreadsheet</text>
<text x="517.0" y="120.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">one command; answers</text>
<text x="517.0" y="138.475" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">marked right are</text>
<text x="517.0" y="155.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">already filled in</text>
<path d="M404,125 L426,125" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<rect x="632" y="60" width="178" height="130" rx="10" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="721.0" y="103.475" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">4. Expert fills</text>
<text x="721.0" y="120.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">the expected answer in</text>
<text x="721.0" y="138.475" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">plain words: 1955 ft,</text>
<text x="721.0" y="155.975" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">not stated</text>
<path d="M608,125 L630,125" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<rect x="836" y="60" width="178" height="130" rx="10" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="925.0" y="112.225" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">5. Test file</text>
<text x="925.0" y="129.725" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">one command; it records</text>
<text x="925.0" y="147.225" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">who wrote the answers</text>
<path d="M812,125 L834,125" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<rect x="1040" y="60" width="178" height="130" rx="10" fill="#e6effe" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="1129.0" y="94.725" font-size="13.5" font-weight="700" fill="#0f1e33" text-anchor="middle">6. Run</text>
<text x="1129.0" y="112.225" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">the system answers</text>
<text x="1129.0" y="129.725" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">every question, by hand-</text>
<text x="1129.0" y="147.225" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">chosen place and by</text>
<text x="1129.0" y="164.725" font-size="11.5" font-weight="400" fill="#33445c" text-anchor="middle">the coordinator</text>
<path d="M1016,125 L1038,125" fill="none" stroke="#5d6d85" stroke-width="2.2" marker-end="url(#head-5d6d85)"/>
<path d="M721.0,232 L721.0,192" fill="none" stroke="#6b46c1" stroke-width="2.2" marker-end="url(#head-6b46c1)"/>
<text x="721.0" y="250" font-size="12.5" font-weight="600" fill="#6b46c1" text-anchor="middle">or start here, with an empty sheet</text>
<text x="620" y="32" font-size="14" font-weight="700" fill="#0f1e33" text-anchor="middle">No step needs programming, and no AI is used until step 6</text>
<rect x="20" y="272" width="18" height="14" rx="4" fill="#eee9fb" stroke="#6b46c1" stroke-width="1.5"/>
<text x="46" y="284" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">done by the expert</text>
<rect x="184.2" y="272" width="18" height="14" rx="4" fill="#fff" stroke="#5d6d85" stroke-width="1.5"/>
<text x="210.2" y="284" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">one command by the team</text>
<rect x="382.9" y="272" width="18" height="14" rx="4" fill="#e6effe" stroke="#1d5fd6" stroke-width="1.5"/>
<text x="408.9" y="284" font-size="12.5" font-weight="400" fill="#33445c" text-anchor="start">the measurement</text>
</svg>
